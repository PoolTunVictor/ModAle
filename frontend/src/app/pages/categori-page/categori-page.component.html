<header class="header-catalogo">
  <div class="header-container">
     <div class="logo">
      <a [routerLink]="['/catalogo']" class="logo-link">
        <h1>MODALE & Co</h1>
      </a>
    </div>

    <nav class="nav-links">
      <a [routerLink]="['/catalogo']" class="nav-link">CATÁLOGO</a>
      <a [routerLink]="['/carrito']" class="nav-link carrito-link">
        CARRITO ({{ obtenerCantidadCesta() }})
      </a>
      <div class="social-icons-header">
        <a href="https://www.facebook.com/profile.php?id=61568465109559" target="_blank">
          <i class="fab fa-facebook-f"></i>
        </a>  
      </div>
    </nav>
  </div>
</header>

<h2 class="titulo-categoria">{{ nombreCategoria | uppercase }}</h2>

<main class="contenido">
  <div class="filtro-precio">
    <label for="rango">Filtrar por precio (máx: {{ precioMax | currency:'USD' }}):</label>
    <input type="range" id="rango" min="0" max="200" [value]="precioMax" (input)="filtrarPorPrecio($event)">
  </div>

  
  <div class="productos-grid">
    <div *ngFor="let producto of productos" class="producto-card">
      <img [src]="producto.imagen" [alt]="producto.nombre" class="imagen-producto">
      <h3>{{ producto.nombre }}</h3>
      <p class="precio">{{ producto.precio | currency:'USD' }}</p>
      <button (click)="agregarACesta(producto)">Agregar al carrito</button>
    </div>
  </div>

  <div *ngIf="mostrarMensaje" class="mensaje-agregado">
    {{ mensajeAgregado }}
  </div>
</main>

<footer class="footer">
        <h2>VISÍTANOS</h2>
      <p class="direccion">📍 Calle 18, Bacabchén, México, 24925</p>
      <p class="horarios">🕒 Lunes a Sábado: 9:00 AM - 8:00 PM | Domingo
</footer>
