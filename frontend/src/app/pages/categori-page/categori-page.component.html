<h2 class="titulo-categoria">{{ nombreCategoria | uppercase }}</h2>

<!-- 🔹 FILTROS DE CATEGORÍAS -->
<div class="filtros-categorias">
  <span
    *ngFor="let cat of categoriasFiltradas"
    (click)="irACategoria(cat.ruta)"
    class="categoria-item"
    [ngClass]="{ 'activa': cat.nombre === nombreCategoria }">
    {{ cat.nombre }}
  </span>
</div>

<main class="contenido">
  <div class="productos-grid">
    <div *ngFor="let producto of productos" class="producto-card">

      <div class="imagen-container" (click)="abrirDetalles(producto)">
        <img [src]="producto.imagen" [alt]="producto.nombre" class="imagen-producto" />
      </div>

      <h3>{{ producto.nombre }}</h3>
      <p class="descripcion">{{ producto.descripcion }}</p>
      <p class="precio">{{ producto.precio | currency:'USD' }}</p>

      <button class="btn-carrito" (click)="agregarACesta(producto)">Agregar al carrito</button>

      <!-- 🔹 MODAL INLINE -->
      <div *ngIf="productoSeleccionado === producto" class="modal-inline">
        <div class="modal-contenido-inline">
          <h2>{{ producto.nombre }}</h2>
          <p><strong>Características:</strong></p>
          <ul>
            <li *ngFor="let item of dividirCaracteristicas(producto.caracteristicas)">
              {{ item }}
            </li>
          </ul>
          <button class="cerrar-btn" (click)="cerrarDetalles()">Cerrar</button>
        </div>
      </div>

    </div>
  </div>

  <div *ngIf="mostrarMensaje" class="mensaje-agregado">
    {{ mensajeAgregado }}
  </div>
</main>
