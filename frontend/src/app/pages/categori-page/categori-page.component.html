<header class="header-categoria">
  <div class="header-container">
    <a class="btn-regresar" (click)="regresarHome()"> 
      <i class="fas fa-arrow-left"></i>
    </a>

    <h2 class="titulo-categoria-header">
      {{ nombreCategoria | titlecase }}
    </h2>
    <button (click)="irAlCarrito()" class="btn-carrito">
      <i class="fa fa-shopping-cart"></i>
    </button>
  </div>
</header>

<div class="mensaje-cesta" *ngIf="mostrarMensaje">
  {{ mensajeAgregado }}
</div>

<main class="categoria-container">
  <aside class="filtro">
    <h4>Filtrar por</h4>

    <div class="filtro-section">
      <ul>
        <li class="activo">Todos</li>
        <li>Skincare</li>
        <li>Ofertas</li>
        <li>Recién llegados</li>
        <li>Más vendidos</li>
      </ul>
    </div>

    <div class="filtro-section">
      <h5>Precio</h5>
      <div class="rango">
        <input
          type="range"
          min="15"
          max="200"
          [value]="precioMax"
          (input)="filtrarPorPrecio($event)"
        />
        <div class="rango-valores">
          <span>15 MXN</span>
          <span>{{ precioMax }} MXN</span>
        </div>
      </div>
    </div>
  </aside>

  <section class="productos">
    <div class="grid-productos">
      <div class="producto" *ngFor="let p of productos">
        <div class="etiqueta" *ngIf="p.etiqueta">{{ p.etiqueta }}</div>

        <img [src]="p.imagen" [alt]="p.nombre" />

        <h5>{{ p.nombre }}</h5>

        <div class="precios">
          <span *ngIf="p.precioOriginal" class="precio-original">${{ p.precioOriginal }}</span>
          <span class="precio-actual">${{ p.precio }}</span>
        </div>

        <button class="btn-cesta" (click)="agregarACesta(p)">
          <i class="fa fa-shopping-cart"></i> Añadir a la cesta
        </button>
      </div>
    </div>
  </section>
</main>
