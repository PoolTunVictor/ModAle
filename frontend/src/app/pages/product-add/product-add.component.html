<div class="content-admin">
  <main class="add-product-section">
    <h2 class="form-title">AGREGAR NUEVO PRODUCTO 🛍️</h2>

    <div class="block">
      <label>Nombre del producto</label>
      <input type="text" [(ngModel)]="producto.nombre">
    </div>

    <div class="block">
      <label>Categoría</label>
      <select [(ngModel)]="producto.categoria">
        <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <div class="block">
      <label>Descripción</label>
      <textarea rows="3" [(ngModel)]="producto.descripcion"></textarea>
    </div>

    <div class="block">
      <label>Características</label>
      <textarea rows="3" [(ngModel)]="producto.caracteristicas"></textarea>
    </div>

    <div class="block">
      <label>Precio</label>
      <input type="number" [(ngModel)]="producto.precio" min="0">
    </div>

    <div class="block">
      <label>Stock</label>
      <input type="number" [(ngModel)]="producto.stock" min="0">
    </div>

    <div class="toggle-group">
      <label><input type="checkbox" [(ngModel)]="producto.activo"><span>Activo</span></label>
      <label><input type="checkbox" [(ngModel)]="producto.nuevo"><span>Nuevo</span></label>
      <label><input type="checkbox" [(ngModel)]="producto.oferta"><span>En oferta</span></label>
    </div>

    <!-- Input de descuento solo si está en oferta -->
    <div class="block" *ngIf="producto.oferta">
      <label>Porcentaje de descuento (%)</label>
      <input type="number" [(ngModel)]="producto.descuento" min="0" max="100" placeholder="Ej: 20">
    </div>

    <div class="block">
      <label>Imagen (URL o archivo)</label>
      <input type="text" [(ngModel)]="producto.imagen">
      <input type="file" (change)="onFileSelected($event)">
      <img *ngIf="previewUrl" [src]="previewUrl" alt="Vista previa" class="preview-img">
    </div>

    <button class="submit-btn" (click)="agregarProducto()">Guardar Producto</button>
  </main>
</div>
