<header class="main-header">
  <div class="container-header">
    <div class="logo">
      <a [routerLink]="['/product-catalog']" class="logo-link">
        <h1>MODALE & Co</h1>
      </a>
    </div>

    <div class="menu-social-wrapper">
      <nav class="nav-menu">
        <ul>
          <li><a routerLink="/catalogo">CATÁLOGO</a></li>
          <li><a routerLink="/agregar-producto">AGREGAR</a></li>
        </ul>
      </nav>
      <div class="social-icons-header">
        <a href="https://www.facebook.com/profile.php?id=61568465109559" target="_blank">
          <i class="fab fa-facebook-f"></i>
        </a>
      </div>
    </div>
  </div>
</header>

<main class="add-product-section">
  <h2 class="form-title">Agregar nuevo producto 🛍️</h2>

  <form class="product-form" (ngSubmit)="agregarProducto()" #productoForm="ngForm">

    <div class="form-group">
      <input type="text" id="nombre" name="nombre" [(ngModel)]="producto.nombre" placeholder=" " required>
      <label for="nombre">Nombre del producto:</label>
    </div>

    <div class="form-group">
      <select id="categoria" name="categoria" [(ngModel)]="producto.categoria" placeholder=" " required>
        <option value="" disabled selected hidden></option>
        <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
      </select>
      <label for="categoria">Categoría:</label>
    </div>

    <div class="form-group">
      <textarea id="descripcion" name="descripcion" [(ngModel)]="producto.descripcion" rows="3" placeholder=" " required></textarea>
      <label for="descripcion">Descripción:</label>
    </div>

    <div class="form-group">
      <textarea id="caracteristicas" name="caracteristicas" [(ngModel)]="producto.caracteristicas" rows="3" placeholder=" "></textarea>
      <label for="caracteristicas">Características:</label>
    </div>

    <div class="form-group">
      <input type="number" id="precio" name="precio" [(ngModel)]="producto.precio" min="0" placeholder=" " required>
      <label for="precio">Precio:</label>
    </div>

    <div class="form-group">
      <input type="number" id="stock" name="stock" [(ngModel)]="producto.stock" min="0" placeholder=" " required>
      <label for="stock">Stock:</label>
    </div>

    <div class="form-checkboxes">
      <label><input type="checkbox" [(ngModel)]="producto.activo" name="activo"> Activo</label>
      <label><input type="checkbox" [(ngModel)]="producto.nuevo" name="nuevo"> Nuevo</label>
      <label><input type="checkbox" [(ngModel)]="producto.oferta" name="oferta"> En oferta</label>
    </div>

    <div class="form-group">
      <input type="text" id="imagen" name="imagen" [(ngModel)]="producto.imagen" placeholder=" ">
      <label for="imagen">Imagen (URL o archivo):</label>
      <input type="file" id="imagenFile" (change)="onFileSelected($event)">
      <img *ngIf="previewUrl" [src]="previewUrl" alt="Vista previa" class="preview-img">
    </div>

    <button type="submit" class="submit-btn" [disabled]="!productoForm.valid">Guardar Producto</button>
  </form>
</main>

<footer class="main-footer">
  <div class="footer-container">
    <div class="footer-info">
      <h2>MODALE & Co</h2>
      <p>Agrega nuevos productos fácilmente</p>
    </div>
  </div>
</footer>
