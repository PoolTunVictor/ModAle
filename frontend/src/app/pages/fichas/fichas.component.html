<div class="header-admin">
</div>

<div class="content-admin">

<div class="fichas-container">

  <div class="filtros-container">

    <!-- FILTRO LOCALIDAD -->
    <select class="filtro" [(ngModel)]="filtroLocalidad" (change)="aplicarFiltros()">
      <option value="all">Todas las localidades</option>
      <option value="Dzibalché">Dzibalché</option>
      <option value="Calkiní">Calkiní</option>
      <option value="Becal">Becal</option>
    </select>

    <!-- FILTRO ESTADO -->
    <select class="filtro" [(ngModel)]="filtroEstado" (change)="aplicarFiltros()">
      <option value="all">Todos los estados</option>
      <option value="Nuevo">Nuevo</option>
      <option value="En proceso">Pendiente / En Proceso</option>
      <option value="Completado">Completado</option>
    </select>

    <!-- FILTRO FECHA -->
    <input 
      type="date" 
      class="filtro" 
      [(ngModel)]="filtroFecha"
      (change)="aplicarFiltros()"
    />

  </div>

  <!-- TABLA -->
  <div class="tabla-container">
    <table class="tabla-fichas">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th>Localidad</th>
          <th>Vista</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ficha of fichasFiltradas">
          <td>{{ ficha.name }}</td>
          <td>{{ ficha.date }}</td>
          <td>
            <span 
              class="status" 
              [ngClass]="{
                'nuevo': ficha.status === 'Nuevo',
                'proceso': ficha.status === 'En proceso',
                'completado': ficha.status === 'Completado'
              }"
            >
              {{ ficha.status }}
            </span>
          </td>
          <td>{{ ficha.location }}</td>
          <td>
            <button class="view-btn" (click)="verDetalle(ficha)">Ver</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="fichaSeleccionada"></div>
</div>
</div>
