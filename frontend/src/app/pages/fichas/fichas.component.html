<div class="header-admin">
</div>

<div class="content-admin">

<div class="fichas-container">

  <div class="filtros-container">

    <!-- FILTRO LOCALIDAD -->
<select class="filtro" [(ngModel)]="filtroLocalidad" (change)="aplicarFiltros()">
  <option value="all">Todas las localidades</option>
  <option *ngFor="let loc of localidades" [value]="loc.nombre">
    {{ loc.nombre }}
  </option>
</select>


    

    <!-- FILTRO FECHA -->
    <input
      type="date"
      class="filtro"
      [(ngModel)]="filtroFecha"
      (change)="aplicarFiltros()"
    />

  </div>

  <!-- TABLA -->
  <div class="tabla-container">
    <table class="tabla-fichas">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Fecha</th>
          <th>Estado</th>
          <th>Localidad</th>
          <th>Vista</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ficha of fichasFiltradas">
          <td>{{ ficha.name }}</td>
          <td>{{ ficha.date }}</td>
          <td>
            <span
              class="status"
              [ngClass]="{
                'nuevo': ficha.status === 'Nuevo',
                'proceso': ficha.status === 'En proceso',
                'completado': ficha.status === 'Completado'
              }"
            >
              {{ ficha.status }}
            </span>
          </td>
          <td>{{ ficha.location }}</td>
          <td>
            <button class="view-btn" (click)="verDetalle(ficha)">Ver</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
</div>
