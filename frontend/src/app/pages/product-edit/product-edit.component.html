<div class="header-admin">
</div>

<div class="content-admin">
  
<div class="container" *ngIf="!cargando; else loading">
  <h2>EDITAR PRODUCTO ✏️</h2>

  <form (ngSubmit)="guardarCambios()" #form="ngForm" class="edit-form">
    <label>ID:</label>
    <input type="text" [value]="producto.id_producto" disabled>

    <label>Nombre:</label>
    <input type="text" [(ngModel)]="producto.nombre" name="nombre" required>

    <label>Precio:</label>
    <input type="number" [(ngModel)]="producto.precio" name="precio" min="0" required>

    <label>Categoría:</label>
    <select [(ngModel)]="producto.categoria" name="categoria" required>
      <option value="" disabled hidden>Selecciona una categoría</option>
      <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
    </select>

    <label>Stock:</label>
    <input type="number" [(ngModel)]="producto.stock" name="stock" min="0">

    <label>Descripción:</label>
    <textarea [(ngModel)]="producto.descripcion" name="descripcion" rows="3"></textarea>
    <label>Caracteristicas:</label>
    <textarea [(ngModel)]="producto.caracteristicas" name="caracteristicas" rows="3"></textarea>
    <label>Imagen (URL):</label>
    <input type="text" [(ngModel)]="producto.imagen" name="imagen" placeholder="Pega URL de imagen">
    <input type="file" (change)="onFileSelected($event)">

    <div *ngIf="producto.imagen" class="preview">
      <img [src]="producto.imagen" alt="Vista previa">
    </div>

     <div class="form-checkboxes">
      <label><input type="checkbox" [(ngModel)]="producto.activo" name="activo"> Activo</label>
      <label><input type="checkbox" [(ngModel)]="producto.nuevo" name="nuevo"> Nuevo</label>
      <label><input type="checkbox" [(ngModel)]="producto.oferta" name="oferta"> En oferta</label>
    </div>

    <div class="botones">
      <button type="submit" [disabled]="guardando || form.invalid">
        💾 {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
      </button>
      <button type="button" (click)="cancelar()">Cancelar</button>
    </div>
    
  </form>
</div>

<ng-template #loading>
  <p>Cargando producto...</p>
</ng-template>
</div>
