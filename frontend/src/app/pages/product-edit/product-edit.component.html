<div class="content-admin">
  <form 
    class="edit-product-section" 
    *ngIf="!cargando; else loading"
    (ngSubmit)="guardarCambios($event)"
  >

    <h2 class="form-title">EDITAR PRODUCTO ✏️</h2>

    <div class="block">
      <label>ID:</label>
      <input type="text" [value]="producto.id_producto" disabled>
    </div>

    <div class="block">
      <label>Nombre del producto</label>
      <input type="text" [(ngModel)]="producto.nombre" name="nombre">
    </div>

    <div class="block">
      <label>Categoría</label>
      <select [(ngModel)]="producto.categoria" name="categoria">
        <option *ngFor="let cat of categorias" [value]="cat">{{ cat }}</option>
      </select>
    </div>

    <div class="block">
      <label>Descripción</label>
      <textarea rows="3" [(ngModel)]="producto.descripcion" name="descripcion"></textarea>
    </div>

    <div class="block">
      <label>Características</label>
      <textarea rows="3" [(ngModel)]="producto.caracteristicas" name="caracteristicas"></textarea>
    </div>

    <div class="block">
      <label>Precio</label>
      <input type="number" [(ngModel)]="producto.precio" min="0" name="precio">
    </div>

    <div class="block">
      <label>Stock</label>
      <input type="number" [(ngModel)]="producto.stock" min="0" name="stock">
    </div>

    <div class="toggle-group">
      <label><input type="checkbox" [(ngModel)]="producto.activo" name="activo"><span>Activo</span></label>
      <label><input type="checkbox" [(ngModel)]="producto.nuevo" name="nuevo"><span>Nuevo</span></label>
      <label><input type="checkbox" [(ngModel)]="producto.oferta" name="oferta"><span>En oferta</span></label>
    </div>

    <div class="block">
      <label>Imagen (URL o archivo)</label>
      <input type="text" [(ngModel)]="producto.imagen" name="imagen">
      <input type="file" (change)="onFileSelected($event)">
      <img *ngIf="previewUrl" [src]="previewUrl" alt="Vista previa" class="preview-img">
    </div>

    <!-- 🚀 AHORA SÍ FUNCIONA -->
    <button type="submit" class="submit-btn">
      {{ guardando ? "Guardando..." : "Guardar Cambios" }}
    </button>

  </form>

  <ng-template #loading>
    <p>Cargando producto...</p>
  </ng-template>
</div>
