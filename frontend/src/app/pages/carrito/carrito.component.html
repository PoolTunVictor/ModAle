<div class="carrito-container">

  <div class="support-section">
    <div class="support-content">
      <h2 class="support-title">CARRITO</h2>
      <p>Revisa tus productos seleccionados</p>
    </div>
  </div>

  <!-- Carrito con productos -->
  <div class="main-content" *ngIf="carrito.length > 0; else emptyCartTemplate">
    <div class="productos-section">
      <div class="productos-frame">
        <div class="producto-item" *ngFor="let producto of carrito">
          <div class="producto-imagen">
            <img [src]="producto.imagen" [alt]="producto.nombre" />
          </div>
          <div class="producto-info">
            <h4>{{ producto.nombre }}</h4>
            <div class="cantidad-section">
              <div class="cantidad-control">
                <button class="cantidad-btn" (click)="disminuirCantidad(producto)">-</button>
                <span class="cantidad-numero">{{ producto.cantidad }}</span>
                <button class="cantidad-btn" (click)="aumentarCantidad(producto)">+</button>
              </div>
            </div>
          </div>
          <div class="producto-precio">
            <span class="precio">${{ (producto.precio * producto.cantidad).toFixed(2) }}</span>
            <button class="remove-btn" (click)="eliminarProducto(producto)">Quitar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="resumen-section">
      <div class="resumen-frame">
        <h3 class="resumen-title">DIRECCIÓN DE ENVÍO</h3>

        <form class="resumen-form">
          <label for="colonia">Colonia</label>
          <input type="text" id="colonia" [(ngModel)]="colonia" name="colonia" placeholder="Ingresa la colonia" required>

         <label for="localidad">Localidad</label>
<select id="localidad" [(ngModel)]="coloniaLugar" name="coloniaLugar" required>
  <option value="" disabled selected>Selecciona una localidad</option>
  <option *ngFor="let loc of localidades" [value]="loc.id_localidad">
    {{ loc.nombre }}
  </option>
</select>

          <label for="referencia">Referencia (opcional)</label>
          <input type="text" id="referencia" [(ngModel)]="referencia" name="referencia" placeholder="Indica referencia adicional">
        </form>

        <div class="resumen-total">
          <span>Total</span>
          <span>${{ getTotal().toFixed(2) }}</span>
        </div>

        <button class="checkout-btn" (click)="generarPedido()" [disabled]="!camposCompletos()">
          Generar Pedido
        </button>

        <p *ngIf="mensajeFicha" class="mensaje-exito">{{ mensajeFicha }}</p>

      </div>
    </div>
  </div>

  <!-- Carrito vacío -->
  <ng-template #emptyCartTemplate>
    <div style="text-align: center; padding: 50px;">
      <h3>Tu carrito está vacío 😢</h3>
      <p>¡Corre a ver nuestros productos!</p>
      <button class="checkout-btn" style="max-width: 200px;" (click)="irCatalogo()">Ir al Catálogo</button>
    </div>
  </ng-template>
</div>
