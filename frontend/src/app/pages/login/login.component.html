<div class="login-container">
  <div class="login-card">
    <div class="login-icon">
      <span class="material-icons">person</span>
    </div>

    <h2>Welcome back</h2>

    <form (ngSubmit)="login()">

      <!-- Email -->
      <div class="input-group">
        <span class="material-icons input-icon" *ngIf="!email">email</span>
        <input 
          type="text" 
          placeholder="Email or Username" 
          [(ngModel)]="email" 
          name="email"
        />
      </div>

      <!-- Password -->
      <div class="input-group">
        <span class="material-icons input-icon" *ngIf="!password">lock</span>
        <input 
          [type]="passwordVisible ? 'text' : 'password'" 
          placeholder="Password" 
          [(ngModel)]="password"
          name="password"
        />
        <button type="button" class="eye-icon" (click)="togglePassword()">
          <span class="material-icons">
            {{ passwordVisible ? 'visibility_off' : 'visibility' }}
          </span>
        </button>
      </div>

      <!-- Remember me -->
      <div class="options">
        <label class="checkbox-container">
          <input type="checkbox" />
          <span class="checkmark"></span>
          Remember me
        </label>
      </div>

      <!-- Sign In -->
      <button type="submit" class="sign-in-btn">Sign In</button>
    </form>

    <!-- Register link -->
    <p class="register-text">
      Don't have an account?
      <a (click)="goToRegister()" class="register-link">Create one</a>
    </p>

    <p class="or-text">OR CONTINUE WITH</p>

  </div>
</div>
